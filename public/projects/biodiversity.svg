<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBio" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061C14" />
      <stop offset="100%" stop-color="#020C08" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgBio)" />

  <rect x="50" y="40" width="700" height="370" rx="16" fill="#0D2B1F" stroke="#10B981" stroke-opacity="0.35" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#143D2D" />
  <circle cx="80" cy="61" r="5" fill="#EF4444" />
  <circle cx="98" cy="61" r="5" fill="#F59E0B" />
  <circle cx="116" cy="61" r="5" fill="#10B981" />
  <text x="140" y="66" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="600">biodiversity-gamma.vercel.app • Ecological Conservation</text>

  <!-- Ecological Hero Graphic -->
  <g transform="translate(200, 220)">
    <!-- Leaf / Shield Graphic -->
    <path d="M 0,-80 C 60,-50 80,40 0,80 C -80,40 -60,-50 0,-80 Z" fill="url(#leafGrad)" />
    <path d="M 0,-70 L 0,70" stroke="#047857" stroke-width="3" />
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
  </g>

  <!-- Content Showcase -->
  <text x="340" y="160" fill="#FFFFFF" font-family="system-ui" font-size="28" font-weight="bold">Biodiversity Hub</text>
  <text x="340" y="190" fill="#6EE7B7" font-family="system-ui" font-size="14" font-weight="600">Endangered Species & Habitat Preservation</text>
  <text x="340" y="215" fill="#94A3B8" font-family="system-ui" font-size="12">Interactive visual archive cataloging endemic flora and fauna across Philippine ecosystems.</text>

  <!-- Metric Badges -->
  <rect x="340" y="245" width="115" height="60" rx="8" fill="#174835" />
  <text x="355" y="270" fill="#6EE7B7" font-family="system-ui" font-size="10">PERFORMANCE</text>
  <text x="355" y="292" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">98 / 100</text>

  <rect x="470" y="245" width="115" height="60" rx="8" fill="#174835" />
  <text x="485" y="270" fill="#6EE7B7" font-family="system-ui" font-size="10">SPECIES</text>
  <text x="485" y="292" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">350+ Cataloged</text>

  <rect x="600" y="245" width="115" height="60" rx="8" fill="#174835" />
  <text x="615" y="270" fill="#6EE7B7" font-family="system-ui" font-size="10">FRAMEWORK</text>
  <text x="615" y="292" fill="#FFFFFF" font-family="monospace" font-size="16" font-weight="bold">React + TW</text>

  <!-- Tagline bar -->
  <rect x="80" y="340" width="640" height="35" rx="8" fill="#143B2C" stroke="#235A44" stroke-width="1" />
  <text x="400" y="362" fill="#A7F3D0" font-family="system-ui" font-size="11" font-weight="600" text-anchor="middle">SCIENCE TECHNOLOGY AND SOCIETY • FINAL CAPSTONE EXHIBIT</text>
</svg>
