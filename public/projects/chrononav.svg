<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgChrono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1026" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgChrono)" />

  <!-- Window Frame -->
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#11162C" stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1.5" />
  
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#181F3E" />
  <circle cx="80" cy="61" r="5" fill="#EF4444" />
  <circle cx="98" cy="61" r="5" fill="#F59E0B" />
  <circle cx="116" cy="61" r="5" fill="#10B981" />
  <text x="140" y="66" fill="#A78BFA" font-family="monospace" font-size="12" font-weight="600">chrononav-ccs.vercel.app • UC Main Campus</text>

  <!-- Interactive Campus Map Grid Simulator -->
  <rect x="80" y="105" width="420" height="275" rx="12" fill="#0C1022" stroke="#334155" stroke-width="1" />
  
  <!-- Campus Rooms & Pathways -->
  <rect x="105" y="130" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="145" y="165" fill="#CBD5E1" font-family="system-ui" font-size="10" text-anchor="middle">CCS LAB 1</text>

  <rect x="210" y="130" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="250" y="165" fill="#CBD5E1" font-family="system-ui" font-size="10" text-anchor="middle">CCS LAB 2</text>

  <rect x="315" y="130" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="355" y="165" fill="#CBD5E1" font-family="system-ui" font-size="10" text-anchor="middle">FACULTY</text>

  <rect x="105" y="270" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="145" y="305" fill="#CBD5E1" font-family="system-ui" font-size="10" text-anchor="middle">ROOM 401</text>

  <rect x="210" y="270" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="250" y="305" fill="#CBD5E1" font-family="system-ui" font-size="10" text-anchor="middle">ROOM 402</text>

  <rect x="315" y="270" width="80" height="60" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <text x="355" y="305" fill="#CBD5E1" font-family="system-ui" font-size="10" text-anchor="middle">DEAN OFFICE</text>

  <!-- Animated Navigation Route Path -->
  <path d="M 145,210 L 250,210 L 250,250 L 355,250 L 355,270" fill="none" stroke="#00F0FF" stroke-width="4" stroke-dasharray="6,4" />
  <circle cx="145" cy="210" r="7" fill="#00F0FF" />
  <circle cx="355" cy="270" r="7" fill="#8B5CF6" />

  <!-- Right Side Panel: Academic Scheduler -->
  <rect x="520" y="105" width="205" height="275" rx="12" fill="#181F3E" stroke="#334155" stroke-width="1" />
  <text x="535" y="135" fill="#F8FAFC" font-family="system-ui" font-size="13" font-weight="bold">Live Schedule</text>
  
  <rect x="535" y="150" width="175" height="50" rx="8" fill="#252F5A" />
  <text x="547" y="170" fill="#00F0FF" font-family="system-ui" font-size="11" font-weight="bold">IT-312 Web Sys</text>
  <text x="547" y="187" fill="#94A3B8" font-family="system-ui" font-size="10">Lab 1 • Prof. Salazar</text>

  <rect x="535" y="210" width="175" height="50" rx="8" fill="#252F5A" />
  <text x="547" y="230" fill="#A78BFA" font-family="system-ui" font-size="11" font-weight="bold">CS-401 Capstone</text>
  <text x="547" y="247" fill="#94A3B8" font-family="system-ui" font-size="10">Room 402 • Scheduled</text>

  <rect x="535" y="270" width="175" height="50" rx="8" fill="#252F5A" />
  <text x="547" y="290" fill="#34D399" font-family="system-ui" font-size="11" font-weight="bold">NET-201 Routing</text>
  <text x="547" y="307" fill="#94A3B8" font-family="system-ui" font-size="10">Cisco Lab • Verified</text>
</svg>
