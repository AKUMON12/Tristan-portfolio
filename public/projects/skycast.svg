<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07172B" />
      <stop offset="100%" stop-color="#020813" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgSky)" />

  <rect x="50" y="40" width="700" height="370" rx="16" fill="#0C203A" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" />
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#132F54" />
  <circle cx="80" cy="61" r="5" fill="#EF4444" />
  <circle cx="98" cy="61" r="5" fill="#F59E0B" />
  <circle cx="116" cy="61" r="5" fill="#10B981" />
  <text x="140" y="66" fill="#7DD3FC" font-family="monospace" font-size="12" font-weight="600">weather-system-by-mrspecific.vercel.app</text>

  <!-- Weather Hero Display -->
  <circle cx="180" cy="180" r="50" fill="url(#sunGrad)" />
  <path d="M 170,220 C 140,220 120,200 130,170 C 140,140 180,140 190,160 C 210,140 250,150 250,180 C 270,180 280,200 270,220 Z" fill="#93C5FD" fill-opacity="0.75" />

  <text x="320" y="170" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="48" font-weight="extrabold">28°C</text>
  <text x="320" y="200" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Partly Cloudy • Cebu City, PH</text>
  <text x="320" y="225" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Humidity: 74% • Wind: 14 km/h • Pressure: 1012 hPa</text>

  <!-- Forecast Row Cards -->
  <rect x="80" y="270" width="135" height="105" rx="10" fill="#132B4C" stroke="#1E4273" stroke-width="1" />
  <text x="147" y="295" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">MON</text>
  <text x="147" y="330" fill="#FFFFFF" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">29°C</text>
  <text x="147" y="355" fill="#38BDF8" font-family="system-ui" font-size="10" text-anchor="middle">Rainy 80%</text>

  <rect x="235" y="270" width="135" height="105" rx="10" fill="#132B4C" stroke="#1E4273" stroke-width="1" />
  <text x="302" y="295" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">TUE</text>
  <text x="302" y="330" fill="#FFFFFF" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">31°C</text>
  <text x="302" y="355" fill="#FBBF24" font-family="system-ui" font-size="10" text-anchor="middle">Sunny</text>

  <rect x="390" y="270" width="135" height="105" rx="10" fill="#132B4C" stroke="#1E4273" stroke-width="1" />
  <text x="457" y="295" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">WED</text>
  <text x="457" y="330" fill="#FFFFFF" font-family="system-ui" font-size="18" font-weight="bold" text-anchor="middle">27°C</text>
  <text x="457" y="355" fill="#38BDF8" font-family="system-ui" font-size="10" text-anchor="middle">Storm 90%</text>

  <rect x="545" y="270" width="175" height="105" rx="10" fill="#132B4C" stroke="#1E4273" stroke-width="1" />
  <text x="632" y="295" fill="#94A3B8" font-family="system-ui" font-size="11" text-anchor="middle">PARTICLE ENGINE</text>
  <text x="632" y="325" fill="#00F0FF" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">60 FPS Loop</text>
  <text x="632" y="350" fill="#34D399" font-family="system-ui" font-size="10" text-anchor="middle">Live OpenWeather Sync</text>
</svg>
