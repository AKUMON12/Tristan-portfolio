<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- Subtle Grid Lines -->
  <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150 M 0,200 L 800,200 M 0,250 L 800,250 M 0,300 L 800,300 M 0,350 L 800,350 M 0,400 L 800,400" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />
  <path d="M 100,0 L 100,450 M 200,0 L 200,450 M 300,0 L 300,450 M 400,0 L 400,450 M 500,0 L 500,450 M 600,0 L 600,450 M 700,0 L 700,450" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.4" />

  <!-- Mock Dashboard Window -->
  <rect x="50" y="40" width="700" height="370" rx="16" fill="#0D1527" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="50" y="40" width="700" height="42" rx="16" fill="#131C31" />
  <circle cx="80" cy="61" r="5" fill="#EF4444" />
  <circle cx="98" cy="61" r="5" fill="#F59E0B" />
  <circle cx="116" cy="61" r="5" fill="#10B981" />
  <text x="140" y="66" fill="#94A3B8" font-family="monospace" font-size="12" font-weight="600">uc-coop-loan-monitoring.up.railway.app</text>

  <!-- Dashboard Metrics Cards -->
  <rect x="80" y="105" width="190" height="85" rx="10" fill="#17233D" stroke="#334155" stroke-width="1" />
  <text x="96" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TOTAL LOANS DISBURSED</text>
  <text x="96" y="162" fill="#00F0FF" font-family="monospace" font-size="22" font-weight="bold">₱14,850,200</text>

  <rect x="290" y="105" width="190" height="85" rx="10" fill="#17233D" stroke="#334155" stroke-width="1" />
  <text x="306" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ACTIVE COOP MEMBERS</text>
  <text x="306" y="162" fill="#10B981" font-family="monospace" font-size="22" font-weight="bold">1,428 Active</text>

  <rect x="500" y="105" width="220" height="85" rx="10" fill="#17233D" stroke="#334155" stroke-width="1" />
  <text x="516" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">AUDIT VERIFICATION</text>
  <text x="516" y="162" fill="#8B5CF6" font-family="monospace" font-size="22" font-weight="bold">100% Zero-Loss</text>

  <!-- Chart Curve -->
  <path d="M 90,340 C 180,310 260,330 350,260 C 440,190 540,240 680,210" fill="none" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)" />
  <path d="M 90,340 C 180,310 260,330 350,260 C 440,190 540,240 680,210 L 680,360 L 90,360 Z" fill="url(#cyanGrad)" fill-opacity="0.08" />

  <!-- Badge in center -->
  <rect x="260" y="375" width="280" height="24" rx="12" fill="#00F0FF" fill-opacity="0.15" stroke="#00F0FF" stroke-opacity="0.4" />
  <text x="400" y="391" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">UC-METC COOP • LOAN MONITORING SYSTEM</text>
</svg>
