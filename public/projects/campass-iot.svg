  <rect x="525" y="205" width="185" height="45" rx="8" fill="#1B374A" />
  <text x="535" y="225" fill="#94A3B8" font-family="monospace" font-size="10">ESP32-CAM CHIP</text>
  <text x="535" y="240" fill="#38BDF8" font-family="monospace" font-size="13" font-weight="bold">Dual-Core 240MHz</text>

  <rect x="525" y="260" width="185" height="45" rx="8" fill="#1B374A" />
  <text x="535" y="280" fill="#94A3B8" font-family="monospace" font-size="10">FIREBASE SYNC</text>
  <text x="535" y="295" fill="#FBBF24" font-family="monospace" font-size="13" font-weight="bold">Real-time Stream</text>
