<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E131F" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Enclosing Cyber Box -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" stroke="url(#cyberBorder)" stroke-width="5" />
  
  <!-- Subtle corner high-tech accents -->
  <path d="M 28 16 L 16 28 M 100 16 L 112 28 M 28 112 L 16 100 M 100 112 L 112 100" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Circled Dot Symbol [☉] (Solar / Cyber Core) -->
  <!-- Outer Circle -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#symbolGrad)" stroke-width="6" />
  
  <!-- Outer Orbit Nodes -->
  <circle cx="64" cy="32" r="3" fill="#00F0FF" />
  <circle cx="64" cy="96" r="3" fill="#8B5CF6" />
  <circle cx="32" cy="64" r="3" fill="#38BDF8" />
  <circle cx="96" cy="64" r="3" fill="#A855F7" />

  <!-- Center Core Dot [☉] -->
  <circle cx="64" cy="64" r="10" fill="url(#symbolGrad)" />
  <circle cx="64" cy="64" r="4" fill="#FFFFFF" />
</svg>
